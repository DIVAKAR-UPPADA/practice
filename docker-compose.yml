services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_delivery_db
      MYSQL_USER: foodflow
      MYSQL_PASSWORD: foodflow_local_password
      MYSQL_ROOT_PASSWORD: foodflow_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_NAME: food_delivery_db
      DB_USER: foodflow
      DB_PASSWORD: foodflow_local_password
      DB_HOST: db
      DB_PORT: "3306"
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: change-this-foodflow-django-secret-before-production
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      FRONTEND_URL: "http://localhost"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - api

volumes:
  mysql_data:
  static_data:
  media_data:
